# Configuración para publicar en Render (https://render.com) — plan gratuito.
# Usa servidor-local.mjs: sirve public/ y hace de puente en tiempo real (SSE) entre la tele y los celulares.
services:
  - type: web
    name: wavelength
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
